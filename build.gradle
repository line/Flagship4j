plugins {
    id "base"
    id 'java-library'
    id 'io.github.gradle-nexus.publish-plugin' version "${nexusPublishPluginVersion}"
    id 'com.linecorp.gradle.license-git' version '0.1.0'
}

allprojects {
    version = System.getenv("SDK_VERSION") ?: (
            "0.1.40" + (project.hasProperty("release") ? "" : "-SNAPSHOT")
    )
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'license'

    compileJava.options.encoding = 'UTF-8'
    compileTestJava.options.encoding = 'UTF-8'
    javadoc.options.encoding = 'UTF-8'

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

nexusPublishing {
    repositories {
        sonatype {
            // OSSRH (oss.sonatype.org) 已於 2025-06-30 停止服務，
            // 改用 Central Portal 提供的 OSSRH Staging API 相容服務
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username.set(System.getenv("MAVEN_USERNAME"))
            password.set(System.getenv("MAVEN_PASSWORD"))
        }
    }
}
